---
- name: Set openssl package
  ansible.builtin.set_fact:
    openssl_pkg: "{{ (ansible_facts['os_family'] | lower == 'redhat') | ternary('openssl-devel', 'libssl-dev') }}"

- name: Install dependencies
  become: true
  ansible.builtin.package:
    name:
      - gcc
      - make
      - tar
      - gzip
      - groff-base
      - "{{ openssl_pkg }}"
    state: present

- name: Create temporary build directory
  ansible.builtin.tempfile:
    state: directory
    suffix: build
  register: tmp_dir

- name: Compile OpenLDAP
  block:
    - name: Download OpenLDAP {{ openldap_version }}
      ansible.builtin.get_url:
        url: "{{ openldap_download_url }}"
        dest: "{{ tmp_dir.path }}/openldap-{{ openldap_version }}.tgz"
        checksum: "{{ openldap_source_checksum | default(omit, true) }}"
        mode: '0644'
      register: openldap_source

    - name: Unpacking OpenLDAP
      ansible.builtin.unarchive:
        remote_src: true
        dest: "{{ tmp_dir.path }}"
        src: "{{ openldap_source.dest }}"

    - name: Set build_dir
      ansible.builtin.set_fact:
        build_dir: "{{ tmp_dir.path }}/openldap-{{ openldap_version }}"

    - name: Configure OpenLDAP
      ansible.builtin.command: >
        ./configure
        --prefix={{ openldap_install_prefix }}
        --with-tls=openssl
      args:
        chdir: "{{ build_dir }}"
        creates: "{{ build_dir }}/Makefile"

    - name: Make OpenLDAP
      ansible.builtin.shell: make depend && make -j{{ ansible_facts['processor_vcpus'] | default(1) }}
      args:
        chdir: "{{ build_dir }}"
        creates: "{{ build_dir }}/servers/slapd/slapd"

    - name: Install OpenLDAP
      become: true
      ansible.builtin.command: make install
      args:
        chdir: "{{ build_dir }}"

  always:
    - name: Delete temporary directory
      ansible.builtin.file:
        path: "{{ tmp_dir.path }}"
        state: absent
