---
- name: Allow OpenLDAP ports in firewalld
  become: true
  ansible.posix.firewalld:
    service: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ ['ldap'] + ((openldap_tls_enabled | bool) | ternary(['ldaps'], [])) }}"
  when:
    - "'firewalld.service' in ansible_facts.services"
    - ansible_facts.services['firewalld.service'].state == 'running'

- name: Setup ldconfig
  become: true
  ansible.builtin.lineinfile:
    path: /etc/ld.so.conf.d/openldap.conf
    line: "{{ openldap_install_prefix }}/lib"
    mode: '0644'
    create: true
  register: _openldap_ldconfig

- name: Refresh linker cache
  become: true
  ansible.builtin.command: ldconfig
  when: _openldap_ldconfig.changed

- name: Create OpenLDAP group
  become: true
  ansible.builtin.group:
    name: "{{ openldap_group }}"
    system: true

- name: Create OpenLDAP user
  become: true
  ansible.builtin.user:
    name: "{{ openldap_user }}"
    group: "{{ openldap_group }}"
    shell: /sbin/nologin
    system: true
    create_home: false

- name: Create Openldap base directory
  become: true
  ansible.builtin.file:
    path: "{{ item.dir }}"
    state: directory
    owner: "{{ openldap_user }}"
    group: "{{ openldap_group }}"
    mode: "{{ item.mode }}"
  loop:
    - dir: "{{ openldap_base_dir }}"
      mode: "0755"
    - dir: "{{ openldap_base_dir }}/data"
      mode: "0700"
    - dir: "{{ openldap_base_dir }}/config"
      mode: "0750"
    - dir: "{{ openldap_base_dir }}/certs"
      mode: "0750"

- name: Set permissions on OpenLDAP TLS files
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: "{{ openldap_user }}"
    group: "{{ openldap_group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ openldap_tls_ca_file }}"
      mode: "0644"
    - path: "{{ openldap_tls_cert_file }}"
      mode: "0644"
    - path: "{{ openldap_tls_key_file }}"
      mode: "0600"
  when: openldap_tls_enabled | bool

- name: config stat
  become: true
  ansible.builtin.stat:
    path: "{{ openldap_base_dir }}/config/cn=config.ldif"
  register: _openldap_config_stat

- name: Generate SSHA hash for OpenLDAP root password
  become: true
  ansible.builtin.command:
    cmd: "{{ openldap_install_prefix }}/sbin/slappasswd -h '{SSHA}' -s {{ openldap_root_password | quote }}"
  register: _openldap_root_pw_hash
  when: not _openldap_config_stat.stat.exists
  changed_when: false
  no_log: true

- name: Copy slapd.ldif
  become: true
  ansible.builtin.template:
    src: slapd.ldif.j2
    dest: "{{ openldap_base_dir }}/slapd.ldif"
    mode: "0600"
  when: not _openldap_config_stat.stat.exists

- name: Bootstrap OpenLDAP cn=config database
  become: true
  ansible.builtin.command:
    cmd: "{{ openldap_install_prefix }}/sbin/slapadd -n 0 -F {{ openldap_base_dir }}/config -l {{ openldap_base_dir }}/slapd.ldif"
    creates: "{{ openldap_base_dir }}/config/cn=config.ldif"
  when: not _openldap_config_stat.stat.exists

- name: Set ownership on cn=config directory
  become: true
  ansible.builtin.file:
    path: "{{ openldap_base_dir }}/config"
    owner: "{{ openldap_user }}"
    group: "{{ openldap_group }}"
    recurse: true
  when: not _openldap_config_stat.stat.exists

- name: Copy slapd.service
  become: true
  ansible.builtin.template:
    src: slapd.service.j2
    dest: /etc/systemd/system/slapd.service
    mode: "0644"

- name: Enable and start OpenLDAP
  become: true
  ansible.builtin.systemd_service:
    name: slapd
    state: started
    enabled: true
    daemon_reload: true
