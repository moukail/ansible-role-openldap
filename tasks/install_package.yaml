---
- name: Install EPEL repository
  become: true
  ansible.builtin.dnf:
    name: epel-release
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

- name: Install requested RPM version
  become: true
  ansible.builtin.dnf:
    name: "openldap-servers >= {{ openldap_version }}"
    state: present
    allow_downgrade: false
  when: ansible_facts['os_family'] == 'RedHat'

- name: Install requested DEB version
  become: true
  ansible.builtin.apt:
    name: "slapd>={{ openldap_version }}"
    state: present
    update_cache: true
    allow_downgrade: false
  when: ansible_facts['os_family'] == 'Debian'