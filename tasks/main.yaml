---
- name: Check installed OpenLDAP versions
  ansible.builtin.include_tasks: check.yaml

- name: Install OpenLDAP when required
  when: openldap_install_required | bool
  block:
    - name: Try package manager installation
      ansible.builtin.include_tasks: install_package.yaml
    - name: Verify package installation
      ansible.builtin.include_tasks: check.yaml
    - name: Verify package installation meets required version
      ansible.builtin.assert:
        that:
          - not (openldap_install_required | bool)
  rescue:
    - name: Compile OpenLDAP from source
      ansible.builtin.include_tasks: compile.yaml

- name: Configure OpenLDAP
  ansible.builtin.include_tasks: configure.yaml
- name: Initialize OpenLDAP directory
  ansible.builtin.include_tasks: initialize.yaml